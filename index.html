<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-C3 藍芽 13-Pin PWM 控制器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2, h3 { margin-top: 0; color: #1a73e8; }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    button:disabled { background-color: #ccc; }
    .slider-group { margin-bottom: 15px; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type=range] { width: 100%; height: 6px; }
    .debug-info {
      font-size: 12px;
      color: #666;
      background: #eef2f5;
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>ESP32-C3 燈光控制面板</h1>

  <!-- 藍芽連線狀態卡片 -->
  <div class="card">
    <h2>藍芽連線</h2>
    <button id="connectBtn" onclick="connectBle()">搜尋並連線 ESP32</button>
    <div id="statusText" style="text-align: center; font-weight: bold; color: #666;">狀態：未連線</div>
  </div>

  <!-- 雙色溫與功率控制卡片 (GPIO 0 & GPIO 1) -->
  <div class="card">
    <h3>雙色溫與功率控制</h3>
    
    <div class="slider-group">
      <div class="slider-label">
        <span>冷色 (GPIO 0): <span id="coldPercentDisplay">50%</span></span>
        <span>暖色 (GPIO 1): <span id="warmPercentDisplay">50%</span></span>
      </div>
      <input type="range" id="colorTempSlider" min="0" max="100" value="50" oninput="updateDualColorPwm()">
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span>燈具總功率 (PWM 幅度)</span>
        <span id="powerPercentDisplay">100%</span>
      </div>
      <input type="range" id="powerSlider" min="0" max="100" value="100" oninput="updateDualColorPwm()">
    </div>

    <div class="debug-info">
      實際 PWM 輸出 ➔ GPIO 0: <span id="pwm0Value">128</span> | GPIO 1: <span id="pwm1Value">128</span>
    </div>
  </div>

  <!-- 單燈控制卡片 (GPIO 2 ~ 10, 20, 21) -->
  <div class="card">
    <h3>單燈獨立控制 (GPIO 2 ~ 21)</h3>
    <div id="otherPinsContainer"></div>
  </div>

  <script>
    // BLE UUID
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;

    // 剩餘可獨立控制的 GPIO 腳位
    const OTHER_PINS = [2, 3, 4, 5, 6, 7, 8, 9, 10, 20, 21];

    // 動態產生其它 GPIO 的控制拉桿
    const container = document.getElementById('otherPinsContainer');
    OTHER_PINS.forEach(pin => {
      const div = document.createElement('div');
      div.className = 'slider-group';
      div.innerHTML = `
        <div class="slider-label">
          <span>GPIO ${pin} 亮度</span>
          <span id="display-pin-${pin}">0%</span>
        </div>
        <input type="range" min="0" max="255" value="0" oninput="onSinglePinChange(${pin}, this.value)">
      `;
      container.appendChild(div);
    });

    // 1. 藍芽連線邏輯
    async function connectBle() {
      try {
        document.getElementById('statusText').innerText = "搜尋裝置中...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32C3_Matrix' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

        document.getElementById('statusText').innerText = "狀態：已連線至 ESP32C3_Matrix";
        document.getElementById('statusText').style.color = "green";
        document.getElementById('connectBtn').innerText = "藍芽已連線";
        document.getElementById('connectBtn').disabled = true;

      } catch (error) {
        console.error("BLE 連線失敗:", error);
        document.getElementById('statusText').innerText = "連線失敗: " + error.message;
        document.getElementById('statusText').style.color = "red";
      }
    }

    // 2. 底層藍芽發送函式
    async function sendBleCommand(payload) {
      if (!rxCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(payload));
        console.log("已發送至 ESP32:", payload);
      } catch (err) {
        console.error("發送失敗:", err);
      }
    }

    // 3. 雙色溫 + 總功率動態計算
    function updateDualColorPwm() {
      const tempVal = parseFloat(document.getElementById('colorTempSlider').value) / 100;
      const powerVal = parseFloat(document.getElementById('powerSlider').value) / 100;

      const coldRatio = 1.0 - tempVal;
      const warmRatio = tempVal;

      const pwm0 = Math.round(255 * coldRatio * powerVal);
      const pwm1 = Math.round(255 * warmRatio * powerVal);

      // 更新畫面顯示
      document.getElementById('coldPercentDisplay').innerText = `${Math.round(coldRatio * 100)}%`;
      document.getElementById('warmPercentDisplay').innerText = `${Math.round(warmRatio * 100)}%`;
      document.getElementById('powerPercentDisplay').innerText = `${Math.round(powerVal * 100)}%`;
      document.getElementById('pwm0Value').innerText = pwm0;
      document.getElementById('pwm1Value').innerText = pwm1;

      // 一次發送 GPIO 0 與 GPIO 1 的 PWM
      sendBleCommand(`0,${pwm0},1,${pwm1}`);
    }

    // 4. 單燈控制發送
    function onSinglePinChange(pin, val) {
      const percent = Math.round((val / 255) * 100);
      document.getElementById(`display-pin-${pin}`).innerText = `${percent}%`;
      sendBleCommand(`${pin},${val}`);
    }
  </script>

</body>
</html>
